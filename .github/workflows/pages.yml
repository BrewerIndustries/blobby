name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            # dev branch → publish into /dev/ subpath
            mkdir -p _site/dev
            cp -r index.html style.css js _site/dev/
            # root redirect to /dev/
            echo '<meta http-equiv="refresh" content="0;url=/dev/">' > _site/index.html
          else
            # main branch → publish at root
            mkdir -p _site
            cp -r index.html style.css js _site/
          fi
          echo "blobby.dabrewer.dev" > _site/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
